/* =========================================================
   ADMIN CHECK
   ========================================================= */

/*
   ใช้ admin_users ซึ่งเป็นวิธีตรวจ Admin
   ของ admin.html ระบบเดิม

   สำคัญ:
   หน้า admin-login.html จะเป็นผู้ Login
   ส่วนหน้านี้มีหน้าที่ "ตรวจ Session + สิทธิ์"
   เท่านั้น
*/

async function getAdminUser(userId){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("admin_users")
      .select(
        "user_id, username"
      )
      .eq(
        "user_id",
        userId
      )
      .maybeSingle();


  if(error){

    console.error(
      "Admin check error:",
      error
    );

    throw error;

  }


  return data;

}



/* =========================================================
   REDIRECT TO LOGIN
   ========================================================= */

function redirectToLogin(){

  window.location.replace(
    "admin-login.html?next=admin.html"
  );

}



/* =========================================================
   REQUIRE ADMIN
   ========================================================= */

async function requireAdmin(){

  try{

    /*
       ขอ Session ปัจจุบัน
    */

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if(error){

      console.error(
        "getSession error:",
        error
      );

      redirectToLogin();

      return false;

    }


    const session =
      data?.session;


    /*
       ไม่มี Session
       → กลับหน้า Login
    */

    if(!session){

      redirectToLogin();

      return false;

    }


    /*
       มี Session
       → ตรวจว่ามีรายชื่อใน admin_users
    */

    const admin =
      await getAdminUser(
        session.user.id
      );


    /*
       ไม่มีสิทธิ์ Admin
    */

    if(!admin){

      console.warn(
        "User is not an admin"
      );


      await supabaseClient
        .auth
        .signOut();


      window.location.replace(
        "admin-login.html"
      );


      return false;

    }


    /*
       ผ่านทุกอย่าง
    */

    adminUserText.textContent =
      "เข้าสู่ระบบในชื่อ: " +
      (
        admin.username ||
        "Admin"
      );


    return true;


  }catch(error){

    console.error(
      "requireAdmin failed:",
      error
    );


    redirectToLogin();

    return false;

  }

}

async function loadSettings(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("site_settings")
      .select(
        "id, settings"
      )
      .eq(
        "id",
        1
      )
      .maybeSingle();


  if(error){

    console.error(error);

    throw error;

  }


  const saved =
    data &&
    data.settings
      ? data.settings
      : {};


  const settings =
    {
      ...defaults,
      ...saved
    };


  fillForm(
    settings
  );

}

function fillForm(data){

  const fields = {

    shopName:
      data.shopName,

    subtitle:
      data.subtitle,

    accountName:
      data.accountName,

    kbank:
      data.kbank,

    trueMoney:
      data.trueMoney,

    statusRight:
      data.statusRight,

    statusText:
      data.statusText,

    intro:
      data.intro,

    copyHint:
      data.copyHint,

    paymentTitle:
      data.paymentTitle,

    wrongTransfer:
      data.wrongTransfer,

    slipText:
      data.slipText,

    footer:
      data.footer,

    walletExtraFee:
      data.walletExtraFee,

    musicUrl:
      data.musicUrl,

    backgroundUrl:
      data.backgroundUrl,

    previewTitle:
      data.previewTitle,

    previewDescription:
      data.previewDescription,

    previewImage:
      data.previewImage,

    image:
      data.image

  };


  Object.keys(fields)
    .forEach(
      function(id){

        const element =
          document.getElementById(
            id
          );


        if(element){

          element.value =
            fields[id] ?? "";

        }

      }
    );


  document.getElementById(
    "musicEnabled"
  ).checked =
    !!data.musicEnabled;


  document.getElementById(
    "backgroundEnabled"
  ).checked =
    !!data.backgroundEnabled;


  document.getElementById(
    "memberEnabled"
  ).checked =
    data.memberEnabled !== false;


  document.getElementById(
    "preview"
  ).src =
    data.image ||
    defaults.image;

}

              {
                id:1,
                settings:settings
              },
              {
                onConflict:"id"
              }
            );


        if(error){

          console.error(error);


          message.textContent =
            "บันทึกไม่สำเร็จ: " +
            error.message;


          return;

        }


        message.textContent =
          "บันทึกข้อมูลเรียบร้อยแล้ว ✓";


        setTimeout(
          function(){

            message.textContent =
              "";

          },
          2500
        );


      }catch(error){

        console.error(error);


        message.textContent =
          "เกิดข้อผิดพลาดในการบันทึกค่ะ";

      }

    }
  );



/* =========================================================
   IMAGE FILE
   ========================================================= */

document
  .getElementById("imageFile")
  .addEventListener(
    "change",
    function(event){

      const file =
        event.target.files[0];


      if(!file){

        return;

      }


      if(
        !file.type.startsWith(
          "image/"
        )
      ){

        alert(
          "กรุณาเลือกไฟล์รูปภาพค่ะ"
        );


        return;

      }


      const reader =
        new FileReader();


      reader.onload =
        function(){

          const value =
            reader.result;


          document.getElementById(
            "image"
          ).value =
            value;


          document.getElementById(
            "preview"
          ).src =
            value;

        };


      reader.readAsDataURL(
        file
      );

    }
  );



/* =========================================================
   IMAGE URL PREVIEW
   ========================================================= */

document
  .getElementById("image")
  .addEventListener(
    "input",
    function(){

      const value =
        this.value.trim();


      if(value){

        document.getElementById(
          "preview"
        ).src =
          value;

      }

    }
  );



/* =========================================================

document

/* =========================================================
   PAYMENT LINK GENERATOR
   ========================================================= */

document
  .getElementById(
    "paymentGeneratorButton"
  )
  .addEventListener(
    "click",
    function(){

      document
        .getElementById(
          "paymentGenerator"
        )
        .classList.toggle(
          "hidden"
        );

    }
  );



document
  .getElementById(
    "generatePayment"
  )
  .addEventListener(
    "click",
    function(){

      const amount =
        document
          .getElementById(
            "paymentAmount"
          )
          .value
          .trim();


      const note =
        document
          .getElementById(
            "paymentNote"
          )
          .value
          .trim();


      if(
        !amount ||
        Number(amount) < 0
      ){

        alert(
          "กรุณาใส่จำนวนเงินค่ะ"
        );


        return;

      }


      const url =
        new URL(
          "payment.html",
          window.location.href
        );


      url.searchParams.set(
        "amount",
        amount
      );


      if(note){

        url.searchParams.set(
          "note",
          note
        );

      }


      document.getElementById(
        "paymentLink"
      ).value =
        url.href;


      document.getElementById(
        "paymentResult"
      ).classList.remove(
        "hidden"
      );

    }
  );



/* =========================================================
   COPY PAYMENT LINK
   ========================================================= */

document
  .getElementById(
    "copyPaymentLink"
  )
  .addEventListener(
    "click",
    async function(){

      const input =
        document.getElementById(
          "paymentLink"
        );


      try{

        await navigator.clipboard.writeText(
          input.value
        );

      }catch(error){

        input.select();


        document.execCommand(
          "copy"
        );

      }


      this.textContent =
        "✓ คัดลอกแล้ว";


      setTimeout(
        () => {

          this.textContent =
            "คัดลอกลิงก์";

        },
        1800
      );

    }
  );

/* =========================================================
   LOGOUT
   ========================================================= */

document
  .getElementById(
    "logoutButton"
  )
  .addEventListener(
    "click",
    async function(){

      this.disabled =
        true;


      this.textContent =
        "กำลังออกจากระบบ...";


      try{

        await supabaseClient
          .auth
          .signOut();

      }catch(error){

        console.error(
          "Logout error:",
          error
        );

      }


      window.location.replace(
        "admin-login.html"
      );

    }
  );



/* =========================================================
   AUTH STATE
   ========================================================= */

supabaseClient.auth.onAuthStateChange(
  function(
    event,
    session
  ){

    /*
       ถ้า Session หายระหว่างใช้งาน
       ให้กลับหน้า Login

       ไม่ตรวจ SIGNED_IN ซ้ำที่นี่
       เพราะ requireAdmin() จัดการตอนเปิดหน้าแล้ว
    */

    if(
      event ===
      "SIGNED_OUT"
    ){

      window.location.replace(
        "admin-login.html"
      );

    }

  }
);



/* =========================================================
   INITIALIZE
   ========================================================= */

async function init(){

  /*
     adminScreen แสดงเฉพาะเมื่อผ่าน
     requireAdmin แล้ว

     แต่เพื่อป้องกันการเห็นเนื้อหาก่อนตรวจ
     เราจะซ่อนทั้งหน้าชั่วคราว
  */

  adminScreen.classList.add(
    "hidden"
  );


  const allowed =
    await requireAdmin();


  if(!allowed){

    return;

  }


  /*
     ผ่านสิทธิ์แล้ว
     ค่อยแสดงหน้า Admin
  */

  adminScreen.classList.remove(
    "hidden"
  );


  try{

    await loadSettings();

  }catch(error){

    console.error(
      "Initial load settings error:",
      error
    );

  }

}


init();

</script>
