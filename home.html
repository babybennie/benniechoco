<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bennie Choco ♡</title>

<meta name="theme-color" content="#FDEAF7">
<meta name="msapplication-TileColor" content="#FDEAF7">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
    background:#FDEAF7;
}


/* =====================================================
   HOME
   ===================================================== */

.home{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    background:#FDEAF7;
}

.home-wrap{
    position:relative;
    width:100%;
    max-width:1536px;
    line-height:0;
}


/* =====================================================
   BACKGROUND
   ===================================================== */

.home-image{
    display:block;
    width:100%;
    height:auto;

    user-select:none;
    -webkit-user-drag:none;
}


/* =====================================================
   CLOUD BUTTONS
   ===================================================== */

.cloud-button{
    position:absolute;

    display:flex;
    align-items:center;
    justify-content:center;

    width:30%;
    min-height:90px;

    transform:translate(-50%, -50%);

    text-decoration:none;

    color:#8d6b83;

    font-family:
        "Trebuchet MS",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

    font-size:clamp(18px, 2.2vw, 34px);
    font-weight:700;
    letter-spacing:1px;

    line-height:1;

    background:
        radial-gradient(
            circle at 25% 55%,
            rgba(255,255,255,.98) 0 18%,
            transparent 19%
        ),
        radial-gradient(
            circle at 42% 38%,
            rgba(255,255,255,.98) 0 23%,
            transparent 24%
        ),
        radial-gradient(
            circle at 62% 42%,
            rgba(255,255,255,.98) 0 25%,
            transparent 26%
        ),
        radial-gradient(
            circle at 78% 58%,
            rgba(255,255,255,.98) 0 19%,
            transparent 20%
        );

    filter:
        drop-shadow(0 7px 10px rgba(170,130,160,.16));

    transition:
        transform .25s ease,
        filter .25s ease;
}


/* ทำให้พื้นที่ตรงกลางเมฆขาวนุ่ม ๆ */

.cloud-button::before{
    content:"";

    position:absolute;

    left:12%;
    right:12%;
    top:25%;
    bottom:18%;

    background:rgba(255,255,255,.96);

    border-radius:50%;

    z-index:-1;
}


/* ตัวหนังสือ */

.cloud-button span{
    position:relative;
    z-index:2;

    text-shadow:
        0 1px 0 rgba(255,255,255,.9),
        0 2px 4px rgba(130,100,125,.12);
}


/* Hover */

.cloud-button:hover{
    transform:translate(-50%, -50%) scale(1.06);

    filter:
        drop-shadow(0 10px 14px rgba(170,130,160,.22));
}


/* =====================================================
   ตำแหน่งปุ่ม
   ===================================================== */

/* Payment */

.payment{
    left:50%;
    top:30%;
}


/* Member */

.member{
    left:32%;
    top:48%;
}


/* Review */

.review{
    left:51%;
    top:67%;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

    .cloud-button{
        width:42%;
        min-height:65px;

        font-size:clamp(15px, 5vw, 23px);
    }

    .payment{
        left:50%;
        top:30%;
    }

    .member{
        left:32%;
        top:48%;
    }

    .review{
        left:51%;
        top:67%;
    }

}

</style>
</head>


<body>

<div class="home">

    <div class="home-wrap">

        <!-- =================================================
             พื้นหลังเปล่า
             ================================================= -->

        <img
            class="home-image"
            src="https://i.postimg.cc/wvbB8Kks/mi-m-ch-x-826-20260913010356.png"
            alt="Bennie Choco"
        >


        <!-- =================================================
             PAYMENT
             ================================================= -->

        <a
            href="index.html"
            class="cloud-button payment"
            aria-label="Payment"
        >
            <span>Payment</span>
        </a>


        <!-- =================================================
             MEMBER
             ================================================= -->

        <a
            href="member.html"
            class="cloud-button member"
            aria-label="Member"
        >
            <span>Member</span>
        </a>


        <!-- =================================================
             REVIEW
             ================================================= -->

        <a
            href="review.html"
            class="cloud-button review"
            aria-label="Review"
        >
            <span>Review</span>
        </a>

    </div>

</div>

</body>
</html>
