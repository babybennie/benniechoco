<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bennie Choco ♡</title>

<meta name="theme-color" content="#FDEAF7">
<meta name="msapplication-TileColor" content="#FDEAF7">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#FDEAF7;
}

body{
    overflow-x:hidden;
}


/* =====================================================
   HOME
   ===================================================== */

.home{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    background:#FDEAF7;
}

.home-wrap{
    position:relative;

    width:100%;
    max-width:1536px;

    line-height:0;
}


/* =====================================================
   BACKGROUND IMAGE
   ===================================================== */

.home-image{
    display:block;

    width:100%;
    height:auto;

    user-select:none;
    -webkit-user-drag:none;
}


/* =====================================================
   INVISIBLE CLICK AREAS
   วางตรงตัวอักษรในภาพ
   ===================================================== */

.click-area{
    position:absolute;

    display:block;

    transform:translate(-50%, -50%);

    background:transparent;

    border:none;
    outline:none;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   PAYMENT
   ===================================================== */

.payment{
    left:50%;
    top:33.5%;

    width:62%;
    height:11%;
}


/* =====================================================
   MEMBER
   ===================================================== */

.member{
    left:50%;
    top:56.2%;

    width:62%;
    height:11%;
}


/* =====================================================
   REVIEW
   ===================================================== */

.review{
    left:50%;
    top:79.2%;

    width:62%;
    height:11%;
}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:600px){

    .payment{
        left:50%;
        top:33.5%;
        width:68%;
        height:10%;
    }

    .member{
        left:50%;
        top:56.2%;
        width:68%;
        height:10%;
    }

    .review{
        left:50%;
        top:79.2%;
        width:68%;
        height:10%;
    }

}

</style>
</head>


<body>

<div class="home">

    <div class="home-wrap">

        <!-- =================================================
             รูปหน้า Home
             ================================================= -->

        <img
            class="home-image"
            src="https://i.postimg.cc/YSS9XN58/mi-m-ch-x-827-20260913012925.png"
            alt="Bennie Choco"
        >


        <!-- =================================================
             กด Payment
             ================================================= -->

        <a
            href="index.html"
            class="click-area payment"
            aria-label="Payment"
        ></a>


        <!-- =================================================
             กด Member
             ================================================= -->

        <a
            href="member.html"
            class="click-area member"
            aria-label="Member"
        ></a>


        <!-- =================================================
             กด Review
             ================================================= -->

        <a
            href="review.html"
            class="click-area review"
            aria-label="Review"
        ></a>

    </div>

</div>

</body>
</html>
