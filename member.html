<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>bennie choco | Stamp Card</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Prompt", sans-serif;
      background: #fff7fb;
      color: #5b3948;
      overflow-x: hidden;
    }

    /* =========================
       Background
    ========================= */

    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -5;
      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255, 184, 213, 0.25),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 75%,
          rgba(255, 214, 230, 0.30),
          transparent 35%
        ),
        #fff7fb;
    }

    #customBackground {
      position: fixed;
      inset: 0;
      z-index: -4;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    #backgroundOverlay {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: rgba(255, 247, 251, 0.55);
      pointer-events: none;
    }

    /* =========================
       Decorative floating items
    ========================= */

    .deco {
      position: fixed;
      pointer-events: none;
      user-select: none;
      opacity: 0.65;
      z-index: -1;
    }

    .deco-1 {
      top: 7%;
      left: 7%;
      font-size: 28px;
      animation: floatUpDown 4s ease-in-out infinite;
    }

    .deco-2 {
      top: 17%;
      right: 7%;
      font-size: 22px;
      animation: floatLeftRight 5s ease-in-out infinite;
    }

    .deco-3 {
      bottom: 15%;
      left: 8%;
      font-size: 20px;
      animation: floatUpDown 4.8s ease-in-out infinite;
    }

    .deco-4 {
      bottom: 9%;
      right: 8%;
      font-size: 30px;
      animation: floatLeftRight 5.5s ease-in-out infinite;
    }

    @keyframes floatUpDown {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes floatLeftRight {
      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(8px);
      }
    }

    @keyframes pulseSoft {
      0%,
      100% {
        transform: scale(1);
        opacity: 0.9;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    /* =========================
       Main
    ========================= */

    .page-container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 28px 16px 45px;
    }

    /* =========================
       Header
    ========================= */

    .brand-header {
      text-align: center;
      margin-bottom: 18px;
    }

    .brand-title {
      color: var(--primary-color, #e85d93);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    .brand-subtitle {
      margin-top: 5px;
      font-size: 13px;
      color: var(--secondary-color, #8b5e3c);
      opacity: 0.8;
      letter-spacing: 0.8px;
    }

    /* =========================
       Card
    ========================= */

    .glass-card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      padding: 22px;
      box-shadow:
        0 20px 55px rgba(122, 67, 91, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* =========================
       Member information
    ========================= */

    .member-heading {
      text-align: center;
      margin-bottom: 20px;
    }

    .member-label {
      font-size: 12px;
      color: var(--secondary-color, #8b5e3c);
      opacity: 0.75;
      margin-bottom: 4px;
    }

    .member-name {
      font-size: 22px;
      font-weight: 600;
      color: var(--primary-color, #e85d93);
      line-height: 1.35;
      word-break: break-word;
    }

    .order-channel {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 9px;
      padding: 6px 13px;
      border-radius: 999px;
      background: rgba(255, 225, 237, 0.85);
      color: var(--secondary-color, #8b5e3c);
      font-size: 12px;
    }

    /* =========================
       Stamp Card
    ========================= */

    .stamp-card {
      margin-top: 20px;
      padding: 18px 14px 20px;
      border-radius: 22px;
      background: rgba(255, 248, 251, 0.9);
      border: 1px solid rgba(232, 93, 147, 0.12);
    }

    .stamp-title {
      text-align: center;
      font-size: 18px;
      font-weight: 500;
      color: var(--secondary-color, #8b5e3c);
      margin-bottom: 5px;
    }

    .stamp-subtitle {
      text-align: center;
      font-size: 12px;
      color: #a47787;
      margin-bottom: 17px;
    }

    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 11px;
      max-width: 330px;
      margin: 0 auto;
    }

    .stamp-slot {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .stamp-slot.empty {
      border: 1.5px dashed rgba(232, 93, 147, 0.25);
      background: rgba(255, 255, 255, 0.48);
    }

    .stamp-slot.filled {
      border: 1px solid rgba(232, 93, 147, 0.12);
      background: rgba(255, 255, 255, 0.72);
      animation: pulseSoft 2.5s ease-in-out infinite;
    }

    .stamp-slot img {
      width: 82%;
      height: 82%;
      object-fit: contain;
      display: block;
    }

    .slot-number {
      position: absolute;
      left: 5px;
      bottom: 4px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.85);
      color: #a47787;
      font-size: 9px;
      line-height: 1;
    }

    /* =========================
       Progress
    ========================= */

    .progress-area {
      margin-top: 21px;
      text-align: center;
    }

    .progress-number {
      font-size: 25px;
      font-weight: 600;
      color: var(--primary-color, #e85d93);
    }

    .progress-text {
      margin-top: 2px;
      color: #9d7886;
      font-size: 12px;
    }

    .progress-bar {
      height: 8px;
      margin: 12px auto 0;
      max-width: 300px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(232, 93, 147, 0.12);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: var(--primary-color, #e85d93);
      transition: width 0.5s ease;
    }

    /* =========================
       Completed
    ========================= */

    .completed-box {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 16px;
      text-align: center;
      background: rgba(255, 228, 239, 0.9);
      color: var(--primary-color, #e85d93);
      font-size: 14px;
      font-weight: 500;
    }

    /* =========================
       Music
    ========================= */

    .music-box {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(232, 93, 147, 0.10);
    }

    .music-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .music-text {
      min-width: 0;
    }

    .music-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--secondary-color, #8b5e3c);
    }

    .music-status {
      margin-top: 2px;
      font-size: 10px;
      color: #a47787;
    }

    .music-button {
      flex-shrink: 0;
      border: 0;
      border-radius: 999px;
      padding: 7px 12px;
      background: var(--primary-color, #e85d93);
      color: white;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    /* =========================
       Buttons
    ========================= */

    .back-button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 15px;
      border: 1px solid rgba(232, 93, 147, 0.18);
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.75);
      color: var(--secondary-color, #8b5e3c);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .back-button:hover {
      transform: translateY(-1px);
      background: white;
    }

    /* =========================
       Invalid member
    ========================= */

    .invalid-member {
      text-align: center;
      padding: 35px 15px;
    }

    .invalid-icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .invalid-title {
      font-size: 19px;
      font-weight: 500;
      color: var(--primary-color, #e85d93);
    }

    .invalid-text {
      margin-top: 7px;
      font-size: 12px;
      line-height: 1.7;
      color: #9d7886;
    }

    /* =========================
       Toast
    ========================= */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      transform: translate(-50%, 20px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(70, 45, 56, 0.92);
      color: white;
      font-size: 12px;
      transition: 0.25s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================
       Mobile
    ========================= */

    @media (max-width: 380px) {
      .page-container {
        padding-left: 12px;
        padding-right: 12px;
      }

      .glass-card {
        padding: 17px;
      }

      .stamp-grid {
        gap: 8px;
      }

      .stamp-slot {
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="page-bg"></div>
  <div id="customBackground"></div>
  <div id="backgroundOverlay"></div>

  <div class="deco deco-1">♡</div>
  <div class="deco deco-2">✦</div>
  <div class="deco deco-3">♡</div>
  <div class="deco deco-4">✧</div>

  <main class="page-container">

    <!-- HEADER -->
    <header class="brand-header">
      <div id="shopName" class="brand-title">
        bennie choco
      </div>

      <div class="brand-subtitle">
        Stamp Card
      </div>
    </header>

    <!-- MAIN CARD -->
    <section class="glass-card">

      <!-- MEMBER INFO -->
      <div id="memberContent">

        <div class="member-heading">

          <div class="member-label">
            MEMBER
          </div>

          <div id="memberName" class="member-name">
            -
          </div>

          <div id="orderChannel" class="order-channel">
            ช่องทางสั่งซื้อ -
          </div>

        </div>

        <!-- STAMP CARD -->
        <div class="stamp-card">

          <div class="stamp-title">
            ♡ Stamp Card ♡
          </div>

          <div class="stamp-subtitle">
            ซื้อ 1 ครั้ง รับ 1 Stamp
          </div>

          <div id="stampGrid" class="stamp-grid">
            <!-- JavaScript จะสร้าง 10 ช่อง -->
          </div>

          <div class="progress-area">

            <div id="progressNumber" class="progress-number">
              0 / 10
            </div>

            <div class="progress-text">
              Stamps
            </div>

            <div class="progress-bar">
              <div
                id="progressFill"
                class="progress-fill"
              ></div>
            </div>

          </div>

          <div id="completedBox" class="completed-box">
            ✦ สะสมครบ 10 Stamps แล้ว ✦
          </div>

        </div>

        <!-- MUSIC -->
        <div id="musicBox" class="music-box">

          <div class="music-row">

            <div class="music-text">
              <div class="music-title">
                ♫ Music
              </div>

              <div id="musicStatus" class="music-status">
                กำลังเตรียมเพลง...
              </div>
            </div>

            <button
              id="musicButton"
              class="music-button"
              type="button"
            >
              เปิดเพลง
            </button>

          </div>

        </div>

      </div>

      <!-- INVALID -->
      <div
        id="invalidMember"
        class="invalid-member"
        style="display:none;"
      >

        <div class="invalid-icon">
          ♡
        </div>

        <div class="invalid-title">
          ไม่พบข้อมูลสมาชิก
        </div>

        <div class="invalid-text">
          กรุณาเปิดลิงก์สมาชิกที่ได้รับจากร้าน bennie choco
        </div>

      </div>

      <button
        class="back-button"
        type="button"
        onclick="location.href='index.html'"
      >
        ← กลับหน้าหลัก
      </button>

    </section>

  </main>

  <!-- MUSIC PLAYER -->
  <audio
    id="backgroundMusic"
    loop
    preload="auto"
  ></audio>

  <!-- TOAST -->
  <div id="toast"></div>


  <script>

    /* =====================================================
       STORAGE
    ===================================================== */

    const STORE_KEY = "bennieChocoPaymentData";

    const defaultStore = {

      shopName: "bennie choco",

      primaryColor: "#e85d93",

      secondaryColor: "#8b5e3c",

      backgroundImage: "",

      backgroundOpacity: 0.55,

      musicUrl: "",

      musicEnabled: false,

      memberEnabled: true,

      memberStampImage: "",

      memberStampEmptyImage: ""

    };


    function getStoreData() {

      try {

        const raw = localStorage.getItem(STORE_KEY);

        if (!raw) {
          return { ...defaultStore };
        }

        return {
          ...defaultStore,
          ...JSON.parse(raw)
        };

      } catch (error) {

        console.warn("Cannot read store data.", error);

        return { ...defaultStore };

      }

    }


    const storeData = getStoreData();


    /* =====================================================
       MEMBER ID
    ===================================================== */

    const urlParams = new URLSearchParams(
      window.location.search
    );

    const memberId =
      urlParams.get("id");


    /* =====================================================
       TEMP MEMBER DATA
       
       จุดนี้เตรียมโครงสร้างไว้ให้ member-admin.html
       และฐานข้อมูลออนไลน์มาเชื่อมต่อภายหลัง

       รูปแบบข้อมูลที่ข้อ 5 ควรส่งมา:

       {
         id: "ABC123",
         name: "ชื่อลูกค้า",
         channel: "LINE",
         stamps: 4
       }

    ===================================================== */

    const demoMembers = {

      /*
      ตัวอย่างสำหรับทดสอบหน้าเว็บ

      ABC123: {
        id: "ABC123",
        name: "น้อง A",
        channel: "LINE",
        stamps: 4
      }
      */

    };


    function getMemberData() {

      /*
       * ในเวอร์ชันจริง ข้อมูลส่วนนี้จะเปลี่ยนเป็น
       * การดึงจากฐานข้อมูลออนไลน์
       *
       * ตอนนี้รองรับ localStorage ชั่วคราว
       * เพื่อให้โครงสร้างหน้าเว็บทำงานได้ก่อน
       */

      try {

        const raw =
          localStorage.getItem("bennieChocoMembers");

        if (raw) {

          const members =
            JSON.parse(raw);

          if (
            members &&
            typeof members === "object" &&
            memberId &&
            members[memberId]
          ) {

            return members[memberId];

          }

        }

      } catch (error) {

        console.warn(
          "Cannot read member data.",
          error
        );

      }


      if (
        memberId &&
        demoMembers[memberId]
      ) {

        return demoMembers[memberId];

      }

      return null;

    }


    /* =====================================================
       THEME
    ===================================================== */

    function applyTheme() {

      const root =
        document.documentElement;

      root.style.setProperty(
        "--primary-color",
        storeData.primaryColor ||
        "#e85d93"
      );

      root.style.setProperty(
        "--secondary-color",
        storeData.secondaryColor ||
        "#8b5e3c"
      );


      document.getElementById("shopName")
        .textContent =
        storeData.shopName ||
        "bennie choco";


      /* Background */

      const background =
        document.getElementById(
          "customBackground"
        );

      const overlay =
        document.getElementById(
          "backgroundOverlay"
        );


      if (storeData.backgroundImage) {

        background.style.backgroundImage =
          `url("${storeData.backgroundImage}")`;

        background.style.display =
          "block";

        overlay.style.background =
          `rgba(255,247,251,${
            storeData.backgroundOpacity ??
            0.55
          })`;

      } else {

        background.style.display =
          "none";

        overlay.style.background =
          "rgba(255,247,251,0)";

      }

    }


    /* =====================================================
       RENDER MEMBER
    ===================================================== */

    function renderMember() {

      const member =
        getMemberData();


      const memberContent =
        document.getElementById(
          "memberContent"
        );

      const invalidMember =
        document.getElementById(
          "invalidMember"
        );


      if (!memberId || !member) {

        memberContent.style.display =
          "none";

        invalidMember.style.display =
          "block";

        return;

      }


      memberContent.style.display =
        "block";

      invalidMember.style.display =
        "none";


      const name =
        member.name ||
        "สมาชิก bennie choco";


      const channel =
        member.channel ||
        "ไม่ระบุ";


      let stamps =
        Number(member.stamps);


      if (
        Number.isNaN(stamps) ||
        stamps < 0
      ) {

        stamps = 0;

      }


      if (stamps > 10) {
        stamps = 10;
      }


      document.getElementById(
        "memberName"
      ).textContent = name;


      document.getElementById(
        "orderChannel"
      ).textContent =
        `ช่องทางสั่งซื้อ ${channel}`;


      renderStamps(stamps);

    }


    /* =====================================================
       RENDER 10 STAMPS
    ===================================================== */

    function renderStamps(stamps) {

      const grid =
        document.getElementById(
          "stampGrid"
        );


      grid.innerHTML = "";


      for (
        let i = 1;
        i <= 10;
        i++
      ) {

        const slot =
          document.createElement("div");


        slot.className =
          "stamp-slot " +
          (
            i <= stamps
              ? "filled"
              : "empty"
          );


        const number =
          document.createElement("span");


        number.className =
          "slot-number";

        number.textContent = i;


        /*
         * ถ้าแอดมินมี PNG Stamp
         * ใช้รูปนั้นในช่องที่ได้รับแล้ว
         */

        if (
          i <= stamps &&
          storeData.memberStampImage
        ) {

          const img =
            document.createElement("img");

          img.src =
            storeData.memberStampImage;

          img.alt =
            `Stamp ${i}`;

          img.onerror = function () {

            this.remove();

          };

          slot.appendChild(img);

        }


        /*
         * ถ้าแอดมินตั้ง PNG สำหรับช่องว่าง
         * สามารถใช้รูปนั้นได้
         */

        else if (
          i > stamps &&
          storeData.memberStampEmptyImage
        ) {

          const img =
            document.createElement("img");

          img.src =
            storeData.memberStampEmptyImage;

          img.alt =
            `Stamp slot ${i}`;

          img.style.opacity =
            "0.28";

          img.onerror = function () {

            this.remove();

          };

          slot.appendChild(img);

        }


        slot.appendChild(number);

        grid.appendChild(slot);

      }


      const progressNumber =
        document.getElementById(
          "progressNumber"
        );


      progressNumber.textContent =
        `${stamps} / 10`;


      const progressFill =
        document.getElementById(
          "progressFill"
        );


      progressFill.style.width =
        `${stamps * 10}%`;


      const completedBox =
        document.getElementById(
          "completedBox"
        );


      if (stamps >= 10) {

        completedBox.style.display =
          "block";

      } else {

        completedBox.style.display =
          "none";

      }

    }


    /* =====================================================
       MUSIC
    ===================================================== */

    const audio =
      document.getElementById(
        "backgroundMusic"
      );

    const musicBox =
      document.getElementById(
        "musicBox"
      );

    const musicButton =
      document.getElementById(
        "musicButton"
      );

    const musicStatus =
      document.getElementById(
        "musicStatus"
      );


    function setupMusic() {

      if (!storeData.musicUrl) {

        musicBox.style.display =
          "none";

        return;

      }


      musicBox.style.display =
        "block";


      audio.src =
        storeData.musicUrl;


      musicButton.textContent =
        "เปิดเพลง";


      musicStatus.textContent =
        "กดเปิดเพลงได้เลย ♫";


      musicButton.onclick =
        toggleMusic;


      /*
       * Browser ส่วนใหญ่ไม่อนุญาต
       * autoplay ที่มีเสียง
       */

      if (storeData.musicEnabled) {

        audio.play()
          .then(() => {

            musicButton.textContent =
              "ปิดเพลง";

            musicStatus.textContent =
              "กำลังเล่นเพลง ♫";

          })
          .catch(() => {

            musicStatus.textContent =
              "แตะปุ่มเพื่อเปิดเพลง ♫";

          });

      }

    }


    function toggleMusic() {

      if (audio.paused) {

        audio.play()
          .then(() => {

            musicButton.textContent =
              "ปิดเพลง";

            musicStatus.textContent =
              "กำลังเล่นเพลง ♫";

          })
          .catch(() => {

            showToast(
              "ไม่สามารถเปิดเพลงได้ค่ะ"
            );

          });

      } else {

        audio.pause();

        musicButton.textContent =
          "เปิดเพลง";

        musicStatus.textContent =
          "หยุดเพลงแล้ว";

      }

    }


    /* =====================================================
       TOAST
    ===================================================== */

    let toastTimer;


    function showToast(message) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add("show");


      clearTimeout(toastTimer);


      toastTimer =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 2200);

    }


    /* =====================================================
       INIT
    ===================================================== */

    applyTheme();

    renderMember();

    setupMusic();

  </script>

</body>
</html>
