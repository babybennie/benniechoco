<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Review | Bennie Choco</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, "Noto Sans Thai", sans-serif;
      background: #fff8fb;
    }

    .mood-btn {
      transition: all 0.2s ease;
    }

    .mood-btn.active {
      transform: scale(1.05);
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.18);
    }

    .review-card {
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="min-h-screen">

  <div class="max-w-2xl mx-auto px-4 py-8">

    <!-- HEADER -->
    <div class="text-center mb-8">

      <h1 class="text-3xl font-bold text-pink-600">
        💗 รีวิวจากลูกค้า
      </h1>

      <p class="text-gray-500 mt-2">
        ขอบคุณที่มาใช้บริการ Bennie Choco นะคะ ♡
      </p>

    </div>


    <!-- REVIEW FORM -->
    <div class="bg-white rounded-3xl shadow-sm border border-pink-100 p-6 mb-8">

      <h2 class="text-xl font-bold text-gray-800 mb-5">
        เขียนรีวิวของคุณ
      </h2>

      <form id="reviewForm">

        <!-- NAME -->
        <div class="mb-4">

          <label
            for="name"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            ชื่อ
          </label>

          <input
            id="name"
            type="text"
            maxlength="100"
            required
            placeholder="ชื่อที่ต้องการให้แสดง"
            class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100"
          >

        </div>


        <!-- SERVICE -->
        <div class="mb-4">

          <label
            for="service"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            บริการที่ใช้
          </label>

          <input
            id="service"
            type="text"
            maxlength="150"
            required
            placeholder="เช่น ดูดวง / Q&A / อื่น ๆ"
            class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100"
          >

        </div>


        <!-- DETAIL -->
        <div class="mb-4">

          <label
            for="detail"
            class="block text-sm font-medium text-gray-700 mb-2"
          >
            รีวิว
          </label>

          <textarea
            id="detail"
            rows="5"
            maxlength="1000"
            required
            placeholder="เล่าความรู้สึกหรือประสบการณ์หลังใช้บริการได้เลยค่ะ ♡"
            class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none resize-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100"
          ></textarea>

        </div>


        <!-- MOOD -->
        <div class="mb-5">

          <p class="block text-sm font-medium text-gray-700 mb-3">
            ความรู้สึกโดยรวม
          </p>

          <div class="flex gap-3">

            <button
              type="button"
              id="moodHappy"
              class="mood-btn flex-1 rounded-2xl border border-pink-200 bg-pink-50 px-4 py-3 text-pink-600"
            >
              😊 ประทับใจ
            </button>

            <button
              type="button"
              id="moodSad"
              class="mood-btn flex-1 rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 text-gray-600"
            >
              😐 เฉย ๆ
            </button>

          </div>

        </div>


        <!-- MESSAGE -->
        <div
          id="message"
          class="hidden rounded-2xl px-4 py-3 mb-4 text-sm"
        ></div>


        <!-- SUBMIT -->
        <button
          id="submitBtn"
          type="submit"
          class="w-full rounded-2xl bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          💗 ส่งรีวิว
        </button>

      </form>

      <p class="text-xs text-gray-400 text-center mt-4">
        รีวิวของคุณจะถูกตรวจสอบก่อนแสดงบนเว็บไซต์นะคะ ♡
      </p>

    </div>


    <!-- APPROVED REVIEWS -->
    <div>

      <h2 class="text-xl font-bold text-gray-800 mb-4">
        💕 รีวิวจากลูกค้า
      </h2>

      <div id="reviewsList">

        <div class="text-center text-gray-400 py-8">
          กำลังโหลดรีวิว...
        </div>

      </div>

    </div>

  </div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jlcjcfhdvrbdihzwbdhu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_bTlJbTM1h2Kl9Z1n7wVfaw_SRJLocBg";


/* =========================================================
   SUPABASE REST HELPER
========================================================= */

async function supabaseRequest(
  table,
  options = {}
) {

  const {
    method = "GET",
    body = null,
    query = ""
  } = options;

  const url =
    `${SUPABASE_URL}/rest/v1/${table}${query}`;

  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json"
  };

  if (method === "POST") {
    headers["Prefer"] = "return=representation";
  }

  const response = await fetch(url, {
    method,
    headers,
    body: body
      ? JSON.stringify(body)
      : undefined
  });

  const text = await response.text();

  let data = null;

  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = text;
  }

  if (!response.ok) {

    const errorMessage =
      data?.message ||
      data?.error_description ||
      data?.hint ||
      data?.details ||
      (
        typeof data === "string"
          ? data
          : JSON.stringify(data)
      );

    throw new Error(
      `HTTP ${response.status}: ${errorMessage}`
    );
  }

  return data;
}


/* =========================================================
   ELEMENTS
========================================================= */

const reviewForm =
  document.getElementById("reviewForm");

const nameInput =
  document.getElementById("name");

const serviceInput =
  document.getElementById("service");

const detailInput =
  document.getElementById("detail");

const moodHappy =
  document.getElementById("moodHappy");

const moodSad =
  document.getElementById("moodSad");

const submitBtn =
  document.getElementById("submitBtn");

const messageBox =
  document.getElementById("message");

const reviewsList =
  document.getElementById("reviewsList");


let selectedMood = "happy";


/* =========================================================
   MOOD
========================================================= */

function setMood(mood) {

  selectedMood = mood;

  moodHappy.classList.remove("active");
  moodSad.classList.remove("active");

  if (mood === "happy") {

    moodHappy.classList.add("active");

  } else {

    moodSad.classList.add("active");

  }
}


moodHappy.addEventListener(
  "click",
  () => setMood("happy")
);


moodSad.addEventListener(
  "click",
  () => setMood("sad")
);


setMood("happy");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type = "success"
) {

  messageBox.classList.remove(
    "hidden",
    "bg-green-50",
    "text-green-700",
    "bg-red-50",
    "text-red-700"
  );

  if (type === "success") {

    messageBox.classList.add(
      "bg-green-50",
      "text-green-700"
    );

  } else {

    messageBox.classList.add(
      "bg-red-50",
      "text-red-700"
    );

  }

  messageBox.textContent = text;
}


function hideMessage() {

  messageBox.classList.add("hidden");

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   SUBMIT REVIEW
========================================================= */

reviewForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    hideMessage();

    const name =
      nameInput.value.trim();

    const service =
      serviceInput.value.trim();

    const detail =
      detailInput.value.trim();


    /* VALIDATE */

    if (!name) {

      showMessage(
        "กรุณากรอกชื่อค่ะ",
        "error"
      );

      nameInput.focus();

      return;
    }


    if (!service) {

      showMessage(
        "กรุณากรอกบริการที่ใช้ค่ะ",
        "error"
      );

      serviceInput.focus();

      return;
    }


    if (!detail) {

      showMessage(
        "กรุณาเขียนรีวิวก่อนส่งค่ะ",
        "error"
      );

      detailInput.focus();

      return;
    }


    /* DISABLE BUTTON */

    submitBtn.disabled = true;

    submitBtn.textContent =
      "กำลังส่งรีวิว...";


    try {

      console.log(
        "กำลังส่งข้อมูลรีวิว...",
        {
          name,
          service,
          detail,
          mood: selectedMood,
          status: "pending"
        }
      );


      /* INSERT */

      const result =
        await supabaseRequest(
          "reviews",
          {
            method: "POST",

            body: {
              name: name,
              service: service,
              detail: detail,
              mood: selectedMood,
              status: "pending"
            }
          }
        );


      console.log(
        "SUPABASE INSERT SUCCESS:",
        result
      );


      /* SUCCESS */

      showMessage(
        "ส่งรีวิวเรียบร้อยแล้วค่ะ ♡ รอตรวจสอบสักครู่นะคะ",
        "success"
      );


      reviewForm.reset();

      setMood("happy");


    } catch (error) {

      console.error(
        "SUPABASE INSERT ERROR:",
        error
      );


      /*
        สำคัญ:
        รอบนี้จะแสดง Error จริงจาก Supabase
        เพื่อให้รู้ว่าติดตรงไหน
      */

      showMessage(
        "ส่งรีวิวไม่สำเร็จ: " +
        (
          error?.message ||
          JSON.stringify(error)
        ),
        "error"
      );


    } finally {

      submitBtn.disabled = false;

      submitBtn.textContent =
        "💗 ส่งรีวิว";

    }

  }
);


/* =========================================================
   LOAD REVIEWS
========================================================= */

async function loadReviews() {

  reviewsList.innerHTML = `
    <div class="text-center text-gray-400 py-8">
      กำลังโหลดรีวิว...
    </div>
  `;


  try {

    const data =
      await supabaseRequest(
        "reviews",
        {
          method: "GET",

          query:
            "?select=id,name,service,detail,mood,status,created_at"
        }
      );


    console.log(
      "REVIEWS FROM SUPABASE:",
      data
    );


    const approved =
      (data || [])
        .filter(
          review =>
            review.status === "approved"
        )
        .sort(
          (a, b) =>
            new Date(b.created_at) -
            new Date(a.created_at)
        );


    if (approved.length === 0) {

      reviewsList.innerHTML = `
        <div class="bg-white rounded-3xl border border-pink-100 p-8 text-center">
          <div class="text-4xl mb-3">
            💕
          </div>

          <p class="text-gray-400">
            ยังไม่มีรีวิวที่เผยแพร่ค่ะ
          </p>
        </div>
      `;

      return;
    }


    reviewsList.innerHTML =
      approved
        .map(review => {

          const mood =
            review.mood === "happy"
              ? "😊"
              : "😐";


          const date =
            review.created_at
              ? new Date(
                  review.created_at
                ).toLocaleDateString(
                  "th-TH",
                  {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                  }
                )
              : "";


          return `
            <div class="review-card bg-white rounded-3xl border border-pink-100 shadow-sm p-5 mb-4">

              <div class="flex items-start justify-between gap-3">

                <div>

                  <div class="font-bold text-gray-800">
                    ${escapeHtml(review.name)}
                  </div>

                  <div class="text-sm text-pink-500 mt-1">
                    ${escapeHtml(review.service)}
                  </div>

                </div>

                <div class="text-xl">
                  ${mood}
                </div>

              </div>


              <div class="mt-4 text-gray-600 leading-relaxed whitespace-pre-wrap">
                ${escapeHtml(review.detail)}
              </div>


              <div class="mt-4 text-xs text-gray-400">
                ${escapeHtml(date)}
              </div>

            </div>
          `;

        })
        .join("");


  } catch (error) {

    console.error(
      "SUPABASE SELECT ERROR:",
      error
    );


    reviewsList.innerHTML = `
      <div class="bg-red-50 text-red-700 rounded-2xl p-5">

        <div class="font-bold mb-2">
          โหลดรีวิวไม่สำเร็จ
        </div>

        <div class="text-sm break-words">
          ${escapeHtml(
            error?.message ||
            JSON.stringify(error)
          )}
        </div>

      </div>
    `;

  }

}


/* =========================================================
   START
========================================================= */

loadReviews();

</script>

</body>
</html>
